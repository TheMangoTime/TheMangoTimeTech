<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Mango Time Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:radial-gradient(circle at top,#1a1a1a,#000);
  color:#fff;
  text-align:center;
}
.header{
  position:fixed;
  top:0;
  width:100%;
  padding:18px 0;
  background:rgba(0,0,0,0.9);
  box-shadow:0 4px 15px rgba(255,165,0,0.25);
}
.header h1{
  margin:0;
  color:#FFA500;
  font-size:26px;
}
.container{
  padding-top:170px;
  min-height:100vh;
}
.slogan{
  font-size:18px;
  opacity:.85;
  margin-bottom:30px;
}
button{
  background:#FFA500;
  color:#000;
  border:none;
  border-radius:10px;
  padding:14px 28px;
  font-size:18px;
  cursor:pointer;
}
.footer{
  margin-top:80px;
  padding:20px;
  font-size:14px;
  opacity:.7;
}
.lang{
  position:fixed;
  right:15px;
  bottom:15px;
}
.lang button{
  background:transparent;
  border:1px solid #FFA500;
  color:#FFA500;
  margin-left:5px;
}
</style>
</head>

<body>
<div class="header">
  <h1>The Mango Time Tech</h1>
</div>

<div class="container">
  <div class="slogan" id="slogan">Building the future of smart technology</div>
  <button id="btn" onclick="go()">Explore Our Vision</button>

  <div class="footer">
    © 2026 The Mango Time Tech — All rights reserved
  </div>
</div>

<div class="lang">
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('tr')">TR</button>
</div>

<script>
function go(){
  window.location.href="about.html";
}
const text={
  en:{s:"Building the future of smart technology",b:"Explore Our Vision"},
  tr:{s:"Akıllı teknolojinin geleceğini inşa ediyoruz",b:"Vizyonumuzu Keşfet"}
};
function setLang(l){
  slogan.innerText=text[l].s;
  btn.innerText=text[l].b;
}
</script>
</body>
</html>
